<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="具身智能论文日报：追踪 Agentic、Robots 和 Robot RL，查阅热点、方法、实验与证据边界。">
  <meta name="theme-color" content="#f8f7ff">
  <title>具身智能论文日报 · Embodied Research</title>
  <link rel="icon" href="mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script defer src="data.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <a class="skip" href="#reading">跳到论文库</a>
  <header class="topbar">
    <div class="frame top-inner">
      <a class="brand" href="#top"><img src="mark.svg" alt="" width="35" height="35"><span>具身智能<span class="brand-suffix">论文日报</span></span></a>
      <nav aria-label="站内导航">
        <a href="#overview">研究概览</a><a href="#reading">论文库</a><a href="#history">往期归档</a>
      </nav>
      <a class="source-link" href="https://arxiv.org/list/cs.RO/new" target="_blank" rel="noopener">arXiv <span aria-hidden="true">↗</span></a>
    </div>
  </header>
  <main id="top">
    <section class="frame hero" aria-labelledby="hero-title">
      <div class="hero-copy">
        <div class="eyebrow"><span></span> EMBODIED RESEARCH / 研究简报</div>
        <h1 id="hero-title">具身智能<br><em>论文日报</em></h1>
        <p>从机器人智能体到全身控制。查阅论文的方法、<br class="wide">实验结果，以及每个结论的证据边界。</p>
        <div class="hero-actions"><a class="primary" href="#reading">浏览论文</a><a class="secondary" href="#history">查看归档</a></div>
      </div>
      <div class="hero-art" aria-hidden="true">
        <svg id="field" viewBox="0 0 640 440" fill="none">
          <defs>
            <linearGradient id="filament" x1="70" x2="530" y1="400" y2="50" gradientUnits="userSpaceOnUse">
              <stop stop-color="#e1dafe"/><stop offset=".48" stop-color="#8f81ed"/><stop offset=".8" stop-color="#a69df6"/><stop offset="1" stop-color="#f0eaff"/>
            </linearGradient>
            <radialGradient id="halo"><stop stop-color="#bfb1ff" stop-opacity=".77"/><stop offset="1" stop-color="#e9e3ff" stop-opacity="0"/></radialGradient>
          </defs>
          <ellipse cx="370" cy="224" rx="257" ry="192" fill="url(#halo)"/>
          <g id="traces"></g>
          <circle cx="372" cy="134" r="4" fill="#6d56de" stroke="white" stroke-width="2"/>
          <circle cx="420" cy="289" r="5" fill="#a591fb" stroke="white" stroke-width="2"/>
          <circle cx="247" cy="214" r="3" fill="#8069e9" stroke="white" stroke-width="1.5"/>
        </svg>
        <span class="art-code">Perception · Policy · Control</span>
      </div>
    </section>
    <section class="frame overview" id="overview" aria-labelledby="overview-title">
      <div class="section-title"><div><div class="eyebrow simple">RESEARCH BRIEF</div><h2 id="overview-title">研究概览</h2></div><div id="issue-label" class="batch"></div></div>
      <p id="scope" class="scope"></p>
      <div id="insights" class="insights"></div>
      <p class="inference" id="inference"></p>
    </section>
    <section class="frame library" id="reading" aria-labelledby="library-title">
      <div class="section-title"><div><div class="eyebrow simple">PAPER LIBRARY</div><h2 id="library-title">论文库</h2></div><form role="search" id="search-form"><label class="sr" for="search">搜索论文</label><input id="search" type="search" placeholder="搜论文、作者或 arXiv 编号" autocomplete="off"></form></div>
      <div class="tools">
        <div id="filters" class="filters" role="group" aria-label="研究主线筛选"></div>
        <div class="period"><label for="issue">期次</label><select id="issue"></select></div>
      </div>
      <div class="results"><p id="count" role="status"></p><button class="text-button" id="compare" type="button">对比当前结果</button></div>
      <div id="papers" class="paper-grid"></div>
      <noscript><p>请启用 JavaScript 以使用期次切换、搜索和论文精读。</p></noscript>
    </section>
    <section class="frame archive" id="history" aria-labelledby="archive-title">
      <div class="section-title"><div><div class="eyebrow simple">ARCHIVE</div><h2 id="archive-title">往期归档</h2></div></div>
      <div id="archive-list" class="archive-list"></div>
      <p class="archive-note">本页面收录已整理的期次和专题，不实时抓取 arXiv。专题与首发批次分开显示。</p>
    </section>
  </main>
  <footer><div class="frame foot"><span>具身智能论文日报</span><span>按 arXiv 公布批次整理 · 以论文原文与官方项目页为准</span><a href="#top">回到顶部</a></div></footer>
  <dialog id="detail"><div class="dialog-bar"><span id="reader-label">论文精读</span><button type="button" id="close" aria-label="关闭阅读面板">×</button></div><div id="detail-body"></div></dialog>
</body>
</html>
